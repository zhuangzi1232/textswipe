name: Build APK
on: [push, workflow_dispatch]
permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: unzip -o TextTriggerSwipe_源码.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        working-directory: src/TextTriggerSwipe
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: src/TextTriggerSwipe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
